<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0d6670">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="방치공 조사">
<title>방치공 조사</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<link rel="stylesheet" href="style.css?v=1">
<script src="config.js?v=1"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.117.2/dist/umd/supabase.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js" defer></script>
</head>
<body>
<div id="gate" class="gate" hidden></div>

<div id="app" hidden>
  <header class="top">
    <div class="brand">방치공 조사<small id="areaName"></small></div>
    <div class="sync" id="syncPills"></div>
    <button class="icon-btn" id="menuBtn" aria-label="메뉴">⋯</button>
  </header>
  <div id="banners"></div>

  <section class="view" id="v-map">
    <div id="kmap"></div>
    <div class="map-top">
      <div class="map-search"><input type="search" id="mapQ" placeholder="번호·이름·지번 찾기" autocomplete="off"></div>
      <div class="chips" id="mapChips"></div>
      <div class="row-r"><button class="chip wx-btn" id="wxBtn" aria-expanded="false">날씨</button></div>
      <div class="wx-panel card" id="wxPanel" hidden></div>
    </div>
    <div class="map-tools">
      <button class="fab" id="hereBtn" title="내 위치">◎</button>
      <button class="fab" id="fitBtn" title="전체 보기">⤢</button>
    </div>
    <div class="peek card" id="peek" hidden></div>
    <div class="map-msg" id="mapMsg" hidden></div>
  </section>

  <section class="view page" id="v-list" hidden>
    <div class="sec">
      <input type="search" id="q" placeholder="이름, 관리번호, 지번, 전화로 찾기" autocomplete="off">
      <div class="chips" id="statusChips"></div>
      <div class="chips" id="riChips"></div>
    </div>
    <div id="flist"></div>
  </section>

  <section class="view page" id="v-cal" hidden>
    <div class="sec">
      <div class="cal-h"><button class="icon-btn" id="calPrev" aria-label="이전 달">‹</button><b id="calTitle"></b><button class="icon-btn" id="calNext" aria-label="다음 달">›</button><button class="btn sm" id="calToday">오늘</button></div>
      <div class="cal" id="cal"></div>
    </div>
    <div id="dayPanel"></div>
  </section>

  <section class="view page" id="v-board" hidden>
    <div id="board"></div>
  </section>

  <section class="view page" id="v-ask" hidden>
    <div class="sec">
      <h2>요청하기</h2>
      <p class="muted small">예: "대곡리 오늘 30곳 잡아줘", "내일 삼청리 신양리 20곳 현재 위치에서", "오늘 순서 다시"</p>
      <form id="askForm" class="askbox"><input id="askIn" placeholder="요청을 입력하세요" autocomplete="off"><button class="btn pri">보내기</button></form>
      <div class="chips" id="askSugg"></div>
    </div>
    <div id="askOut"></div>
  </section>

  <nav class="tabs">
    <button class="tab" data-tab="map"><svg viewBox="0 0 24 24"><path d="M12 21s-7-6.2-7-11.5A7 7 0 0 1 19 9.5C19 14.8 12 21 12 21z"/><circle cx="12" cy="9.5" r="2.5"/></svg>지도</button>
    <button class="tab" data-tab="list"><svg viewBox="0 0 24 24"><path d="M8 6h13M8 12h13M8 18h13M3 6h.01M3 12h.01M3 18h.01"/></svg>목록</button>
    <button class="tab" data-tab="cal"><svg viewBox="0 0 24 24"><rect x="3" y="5" width="18" height="16" rx="2"/><path d="M3 10h18M8 3v4M16 3v4"/></svg>일정</button>
    <button class="tab" data-tab="board"><svg viewBox="0 0 24 24"><path d="M4 20V10M10 20V4M16 20v-7M22 20H2"/></svg>현황</button>
    <button class="tab" data-tab="ask"><svg viewBox="0 0 24 24"><path d="M21 12a8 8 0 0 1-11.6 7.1L4 20l1-4.6A8 8 0 1 1 21 12z"/></svg>요청</button>
  </nav>
</div>

<div class="sheet" id="sheet" hidden></div>
<div class="menu card" id="menu" hidden></div>
<div id="toastSlot"></div>
<script src="app.js?v=1"></script>
</body>
</html>
